<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 360" role="img" aria-labelledby="t d"><title id="t">패드 위치 비교 원리 · 합성 예시</title><desc id="d">가상의 네 패드 중 하나를 오른쪽으로 옮겼을 때 기존 위치와 생성 위치의 외곽선이 갈라집니다.</desc><rect width="840" height="360" fill="#f3f2ed"/><g fill="#33413a" font-family="sans-serif"><text x="42" y="49" font-size="21">기준과 생성 결과를 같은 좌표에 놓기</text><text x="42" y="78" font-size="15">검사 원리를 설명하기 위한 가상 도형</text></g><g transform="translate(150 118)" fill="none"><rect x="0" y="0" width="212" height="166" rx="5" stroke="#a1aaa0"/><g stroke="#384b44" stroke-width="3"><path d="M-20 22h65v39h-65z M167 22h65v39h-65z M167 105h65v39h-65z M-20 105h65v39h-65z"/></g><g stroke="#af5139" stroke-width="3" stroke-dasharray="7 4"><path d="M-20 22h65v39h-65z M167 22h65v39h-65z M183 105h65v39h-65z M-20 105h65v39h-65z"/></g><path d="M249 124h52l25-23h32" fill="none" stroke="#af5139" stroke-width="2"/></g><g font-family="sans-serif" fill="#33413a"><text x="520" y="213" font-size="22">패드 한 개의 위치 차이</text><text x="520" y="244" font-size="16">핀 수가 같아도 외곽선이 어긋납니다.</text></g><g font-family="sans-serif" font-size="15" fill="#33413a"><path d="M50 324h37" stroke="#384b44" stroke-width="3"/><text x="96" y="329">기준 위치</text><path d="M195 324h37" stroke="#af5139" stroke-width="3" stroke-dasharray="7 4"/><text x="241" y="329">생성 위치</text></g></svg>