  <path d="M645 142v162" class="guide"/>
  <rect x="750" y="155" width="114" height="123" rx="3" class="ink" stroke-dasharray="6 5"/><g fill="#dde2d9" stroke="#53655b" stroke-width="1.5"><rect x="724" y="173" width="53" height="29" rx="3" fill="#13614e"/><rect x="724" y="234" width="53" height="29" rx="3"/><rect x="837" y="234" width="53" height="29" rx="3"/><rect x="837" y="173" width="53" height="29" rx="3"/></g><g class="mono" text-anchor="middle"><text x="751" y="194" style="fill:white">1</text><text x="751" y="255">2</text><text x="864" y="255">3</text><text x="864" y="194">4</text></g>
  <text x="45" y="344" class="cap">핀 번호·이름, 부품의 치수</text><text x="377" y="344" class="cap">회로에서 신호가 연결될 단자</text><text x="696" y="344" class="cap">기판에 납땜할 패드의 위치</text>
  <path d="M34 366h932" class="guide"/><rect x="45" y="386" width="14" height="14" rx="2" fill="#13614e"/><text x="70" y="400" class="cap">강조색: 같은 1번 핀</text><text x="966" y="400" text-anchor="end" class="cap">점선: 부품 몸체의 경계</text>
