<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc" xml:lang="ko">
  <title id="title">핀 표에서 심볼과 풋프린트로 · 개념도</title>
  <desc id="desc">실제 도면이 아닌 가상의 4핀 부품이다. 데이터시트의 1번 A가 회로 심볼의 입력 단자와 기판의 왼쪽 위 패드로 대응된다. 점선은 부품 몸체의 경계다.</desc>
  <style>text{font-family:'Noto Sans CJK KR','Malgun Gothic',sans-serif;fill:#24342f}.k{font-size:22px;font-weight:650}.cap{font-size:19px}.mono{font:18px monospace}.ink{fill:none;stroke:#34473f;stroke-width:2}.guide{fill:none;stroke:#a6b1a8;stroke-width:1.5}.accent{fill:#13614e}.paper{fill:#fffefa;stroke:#acb7ae;stroke-width:1.5}</style>
  <rect width="1000" height="430" fill="#f7f7f0"/>
  <g transform="translate(34 0)"><text y="47" font-size="29" font-weight="700">같은 핀, 두 가지 표현</text><text x="932" y="44" text-anchor="end" class="cap">개념도 · 합성 4핀 부품</text><path d="M0 67h932" class="guide"/></g>
  <text x="45" y="107" class="k">입력 / 데이터시트</text><text x="377" y="107" class="k">출력 / 회로 심볼</text><text x="696" y="107" class="k">출력 / 기판 풋프린트</text>
  <!-- A synthetic pin table and package sketch, not a document capture. -->
