  <g class="mono"><rect x="67" y="155" width="70" height="31" fill="#d4e9dd"/><text x="78" y="177" class="accent">1 : A</text><text x="78" y="211">2 : B</text><text x="78" y="245">3 : C</text><text x="78" y="279">4 : D</text></g>
  <path d="M156 157v130" class="guide"/><rect x="197" y="194" width="50" height="62" class="ink"/><path d="M182 204h15m50 0h15m-80 39h15m50 0h15" class="ink"/><circle cx="205" cy="203" r="3" fill="#13614e"/><path d="M182 170v21m80-21v21m-80-13h80m-80 0 6-3m-6 3 6 3m74-3-6-3m6 3-6 3" class="guide"/>
